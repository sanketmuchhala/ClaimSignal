<svg xmlns="http://www.w3.org/2000/svg" width="720" height="292" viewBox="0 0 720 292" role="img" aria-label="Where the same routing policy sends each model's claims">
<rect x="0.5" y="0.5" width="719" height="291" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Where the same routing policy sends each model's claims</text>
<text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">The deployed service never lets LLM output auto-resolve; the LLM rows show what the same thresholds would do.</text>
<rect x="20" y="62" width="10" height="10" rx="2" fill="#b42318"/>
<text x="34" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">Auto-resolved</text>
